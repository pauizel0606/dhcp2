```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pau Izquierdo DHCP2</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #120700;
            color: white;
            position: relative;
        }

        /* FONDO ANIMADO */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -2;
            background:
                radial-gradient(circle at 20% 20%, #ff7a00 0%, transparent 30%),
                radial-gradient(circle at 80% 80%, #ff3c00 0%, transparent 30%),
                linear-gradient(135deg, #120700, #2b0e00, #130600);
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.6;
            animation: float 12s infinite ease-in-out;
        }

        .blob:nth-child(1) {
            width: 350px;
            height: 350px;
            background: #ff6a00;
            top: -100px;
            left: -100px;
        }

        .blob:nth-child(2) {
            width: 450px;
            height: 450px;
            background: #ff3d00;
            bottom: -150px;
            right: -100px;
            animation-delay: -4s;
        }

        .blob:nth-child(3) {
            width: 250px;
            height: 250px;
            background: #ff9800;
            top: 45%;
            left: 45%;
            animation-delay: -8s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(80px, -50px) scale(1.2);
            }
        }

        /* PARTICULAS */

        .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffb15c;
            border-radius: 50%;
            opacity: 0.7;
            animation: rise linear infinite;
        }

        @keyframes rise {
            from {
                transform: translateY(110vh);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            80% {
                opacity: 0.5;
            }

            to {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }

        /* CONTENIDO */

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
            animation: appear 1s ease;
        }

        .title h1 {
            font-size: clamp(32px, 5vw, 60px);
            font-weight: 800;
            letter-spacing: 2px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #ffb15c,
                #ff6a00,
                #ffffff
            );

            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: gradient 5s infinite linear;
        }

        .title p {
            margin-top: 8px;
            color: #ffd2a3;
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        @keyframes gradient {
            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }
        }

        /* VIDEO */

        .video-container {
            width: min(1000px, 92vw);
            aspect-ratio: 16 / 9;

            padding: 5px;

            border-radius: 20px;

            background: linear-gradient(
                135deg,
                #ff9d42,
                #ff4d00,
                #ffb15c,
                #ff4d00
            );

            background-size: 300% 300%;
            animation: borderAnimation 5s ease infinite;

            box-shadow:
                0 0 30px rgba(255, 90, 0, 0.4),
                0 0 80px rgba(255, 90, 0, 0.15);
        }

        @keyframes borderAnimation {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .video {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 16px;
            background: #000;
            display: block;
        }

        .footer {
            margin-top: 20px;
            color: rgba(255, 210, 163, 0.7);
            font-size: 13px;
            letter-spacing: 1px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* MOVIL */

        @media (max-width: 600px) {

            .container {
                padding: 15px;
            }

            .title {
                margin-bottom: 20px;
            }

            .title p {
                font-size: 11px;
                letter-spacing: 2px;
            }

            .video-container {
                width: 96vw;
                border-radius: 14px;
            }

            .video {
                border-radius: 10px;
            }

            .footer {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <div class="particles" id="particles"></div>

    <main class="container">

        <div class="title">
            <h1>Pau Izquierdo DHCP2</h1>
            <p>Configuració DHCP</p>
        </div>

        <div class="video-container">

            <iframe
                class="video"
                src="https://docs.google.com/videos/d/1ojS19a5CRuC8ayQFCHuriSKT8dRldWzSEDukoZIQ-2k/play?usp=sharing"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>

        </div>

        <div class="footer">
            Pau Izquierdo · DHCP2
        </div>

    </main>

    <script>

        const particles = document.getElementById("particles");

        for (let i = 0; i < 60; i++) {

            const particle = document.createElement("div");

            particle.classList.add("particle");

            particle.style.left = Math.random() * 100 + "%";

            particle.style.animationDuration =
                (5 + Math.random() * 10) + "s";

            particle.style.animationDelay =
                Math.random() * 10 + "s";

            const size = 2 + Math.random() * 5;

            particle.style.width = size + "px";
            particle.style.height = size + "px";

            particles.appendChild(particle);
        }

    </script>

</body>
</html>
